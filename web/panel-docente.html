<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del Docente · TE ML</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/docente.css">
</head>

<body>
    <!-- Telón de fondo para menú móvil -->
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="app-shell">
        <!-- Sidebar -->
        <aside class="app-sidebar">
            <div class="sidebar-header">
                <a href="panel-docente.html" class="sidebar-brand">
                    <div class="sidebar-logo">
                        <i class="ph-bold ph-chalkboard-teacher"></i>
                    </div>
                    <span class="sidebar-title">TE ML</span>
                </a>
                <button class="sidebar-close-btn" id="sidebar-close-btn" aria-label="Cerrar menú">
                    <i class="ph-bold ph-x"></i>
                </button>
            </div>

            <nav class="sidebar-nav">
                <a href="javascript:void(0)" class="nav-item active" id="nav-clases">
                    <i class="ph ph-books"></i> Mis Clases
                </a>
                <a href="javascript:void(0)" class="nav-item" id="nav-riesgo">
                    <i class="ph ph-warning-circle"></i> Estudiantes en riesgo
                </a>
            </nav>

            <!-- Resumen general, se llena al cargar -->
            <div class="sidebar-resumen" id="sidebar-resumen"></div>

            <div class="sidebar-footer">
                <a href="login.html" id="btn-salir" class="nav-item text-danger" title="Cerrar Sesión">
                    <i class="ph ph-sign-out"></i> Cerrar Sesión
                </a>
            </div>
        </aside>

        <!-- Contenido -->
        <main class="app-main">
            <header class="app-topbar">
                <div class="topbar-left">
                    <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Abrir menú de navegación">
                        <i class="ph-bold ph-list"></i>
                    </button>
                    <div>
                        <h1 class="topbar-title" id="nombre-docente">Panel del Docente</h1>
                        <p class="topbar-sub" id="sub-docente">Cargando...</p>
                    </div>
                </div>
                <div class="topbar-actions">
                    <div class="avatar" id="avatar-docente" title="">·</div>
                    <a href="login.html" class="btn btn-ghost btn-sm btn-logout" id="btn-salir-top">
                        <i class="ph ph-sign-out"></i>
                        <span class="logout-label">Cerrar Sesión</span>
                    </a>
                </div>
            </header>

            <div class="app-content">
                <nav class="miga" id="miga" aria-label="Ruta de navegación"></nav>
                <div id="vista"></div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/global.js"></script>
    <script src="js/panel-docente.js"></script>
</body>

</html>
